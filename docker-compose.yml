version: "3.9"

services:
  # ── MySQL database ────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mybasics_expenses_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: mybasics_expenses
      MYSQL_USER: mybasics_user
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Schema is owned by golang-migrate now (migrations/000001_init... etc.),
      # not auto-loaded via docker-entrypoint-initdb.d. Run `migrate up` against
      # the DB after it starts. The MySQL container still creates the empty
      # database via MYSQL_DATABASE.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mybasics_expenses_net

  # ── API server ────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: mybasics_expenses_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8081
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: mybasics_user
      DB_PASSWORD: secret
      DB_NAME: mybasics_expenses
      # Outbound email via Mailtrap sandbox (hosted SMTP that traps messages in a
      # web inbox — no local mail server needed). Host/port default to Mailtrap;
      # the credentials are secret, so they come from a local .env (gitignored),
      # substituted here. Leave SMTP_USERNAME empty to disable sending.
      SMTP_HOST: ${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-MyBasics-Expenses <no-reply@mybasics.local>}
    ports:
      - "8081:8081"
    networks:
      - mybasics_expenses_net

networks:
  mybasics_expenses_net:
    driver: bridge

volumes:
  db_data:
